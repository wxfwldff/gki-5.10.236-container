name: 内核构建 - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU
      sub_level:
        description: "内核子版本号（5.10.NNN）。X = LTS 分支；all = 全部版本（串行，很慢，建议只选一个）"
        required: true
        type: choice
        options:
          - "all"
          - "66"
          - "81"
          - "101"
          - "110"
          - "117"
          - "136"
          - "149"
          - "160"
          - "168"
          - "177"
          - "185"
          - "198"
          - "205"
          - "209"
          - "218"
          - "226"
          - "233"
          - "236"
          - "237"
          - "240"
          - "246"
          - "X"
        default: "236"

      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      sub_level:
        description: "内核子版本号；all = 构建全部维护版本"
        required: false
        type: string
        default: "all"
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 关闭
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

jobs:
  # 把网页上选中的 sub_level 翻译成 build.yml 需要的 os_patch_level / revision。
  # 这样矩阵里永远只有你选的那一个版本，不会一次跑 22 个把 runner 内存打爆。
  resolve-target:
    name: "解析目标版本"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
    steps:
      - id: map
        run: |
          # 把网页上选中的 sub_level 翻译成 build.yml 需要的 matrix。
          # 只生成被选中的那一个版本，避免一次并行拉起 22 个内核构建打爆 runner 内存。
          SUB="${{ inputs.sub_level }}"

          if [ "$SUB" = "all" ]; then
            echo 'matrix=[{"sub_level":"66","os_patch_level":"2022-01","revision":"r11"},{"sub_level":"81","os_patch_level":"2022-03","revision":"r11"},{"sub_level":"101","os_patch_level":"2022-04","revision":"r28"},{"sub_level":"110","os_patch_level":"2022-07","revision":"r1"},{"sub_level":"117","os_patch_level":"2022-09","revision":"r1"},{"sub_level":"136","os_patch_level":"2022-11","revision":"r15"},{"sub_level":"149","os_patch_level":"2023-01","revision":"r1"},{"sub_level":"160","os_patch_level":"2023-03","revision":"r1"},{"sub_level":"168","os_patch_level":"2023-04","revision":"r9"},{"sub_level":"177","os_patch_level":"2023-07","revision":"r3"},{"sub_level":"185","os_patch_level":"2023-09","revision":"r1"},{"sub_level":"198","os_patch_level":"2024-01","revision":"r17"},{"sub_level":"205","os_patch_level":"2024-03","revision":"r1"},{"sub_level":"209","os_patch_level":"2024-05","revision":"r13"},{"sub_level":"218","os_patch_level":"2024-08","revision":"r14"},{"sub_level":"226","os_patch_level":"2024-11","revision":"r8"},{"sub_level":"233","os_patch_level":"2025-02","revision":"r1"},{"sub_level":"236","os_patch_level":"2025-05","revision":"r1"},{"sub_level":"237","os_patch_level":"2025-06","revision":"r1"},{"sub_level":"240","os_patch_level":"2025-09","revision":"r1"},{"sub_level":"246","os_patch_level":"2025-12","revision":"r1"},{"sub_level":"X","os_patch_level":"lts","revision":"r1"}]' >> "$GITHUB_OUTPUT"
            echo "目标: android12-5.10 全部 22 个维护版本（串行构建）"
            exit 0
          fi

          case "$SUB" in
          "66") echo 'matrix=[{"sub_level":"66","os_patch_level":"2022-01","revision":"r11"}]' >> "$GITHUB_OUTPUT" ;;
          "81") echo 'matrix=[{"sub_level":"81","os_patch_level":"2022-03","revision":"r11"}]' >> "$GITHUB_OUTPUT" ;;
          "101") echo 'matrix=[{"sub_level":"101","os_patch_level":"2022-04","revision":"r28"}]' >> "$GITHUB_OUTPUT" ;;
          "110") echo 'matrix=[{"sub_level":"110","os_patch_level":"2022-07","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "117") echo 'matrix=[{"sub_level":"117","os_patch_level":"2022-09","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "136") echo 'matrix=[{"sub_level":"136","os_patch_level":"2022-11","revision":"r15"}]' >> "$GITHUB_OUTPUT" ;;
          "149") echo 'matrix=[{"sub_level":"149","os_patch_level":"2023-01","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "160") echo 'matrix=[{"sub_level":"160","os_patch_level":"2023-03","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "168") echo 'matrix=[{"sub_level":"168","os_patch_level":"2023-04","revision":"r9"}]' >> "$GITHUB_OUTPUT" ;;
          "177") echo 'matrix=[{"sub_level":"177","os_patch_level":"2023-07","revision":"r3"}]' >> "$GITHUB_OUTPUT" ;;
          "185") echo 'matrix=[{"sub_level":"185","os_patch_level":"2023-09","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "198") echo 'matrix=[{"sub_level":"198","os_patch_level":"2024-01","revision":"r17"}]' >> "$GITHUB_OUTPUT" ;;
          "205") echo 'matrix=[{"sub_level":"205","os_patch_level":"2024-03","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "209") echo 'matrix=[{"sub_level":"209","os_patch_level":"2024-05","revision":"r13"}]' >> "$GITHUB_OUTPUT" ;;
          "218") echo 'matrix=[{"sub_level":"218","os_patch_level":"2024-08","revision":"r14"}]' >> "$GITHUB_OUTPUT" ;;
          "226") echo 'matrix=[{"sub_level":"226","os_patch_level":"2024-11","revision":"r8"}]' >> "$GITHUB_OUTPUT" ;;
          "233") echo 'matrix=[{"sub_level":"233","os_patch_level":"2025-02","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "236") echo 'matrix=[{"sub_level":"236","os_patch_level":"2025-05","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "237") echo 'matrix=[{"sub_level":"237","os_patch_level":"2025-06","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "240") echo 'matrix=[{"sub_level":"240","os_patch_level":"2025-09","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "246") echo 'matrix=[{"sub_level":"246","os_patch_level":"2025-12","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
          "X") echo 'matrix=[{"sub_level":"X","os_patch_level":"lts","revision":"r1"}]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::未知的 sub_level: $SUB"
              exit 1
              ;;
          esac

          if [ "$SUB" = "X" ]; then
            echo "目标: android12-5.10-lts（最新 LTS 分支）"
          else
            echo "目标: android12-5.10-$SUB"
          fi

  build-kernels-a12-5-10:
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: resolve-target
    strategy:
      fail-fast: false
      # LTO 链接 vmlinux.o 时 lld 会把全部目标文件的 bitcode 同时读入内存，
      # 单个 job 峰值约 8GB，而 ubuntu-24.04 runner 只有 16GB。
      # 之前 22 个版本全并行 → OOM killer 杀掉 runner，日志伪装成「编译内核」失败。
      # 串行 + build.yml 里的 --thinlto-jobs=2 双保险。
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.resolve-target.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
